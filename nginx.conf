# nginx auf dem Hetzner-Host (Reverse-Proxy vor dem Docker-Container auf :3000).
#
# Reihenfolge beim ersten Einrichten (Zertifikat existiert noch nicht):
#   1. Nur den ersten server-Block (Port 80) aktivieren, nginx neu laden.
#   2. certbot certonly --webroot -w /var/www/certbot -d lindermedia.de -d www.lindermedia.de
#   3. Die beiden 443-Bloecke aktivieren, nginx neu laden.
# Hauptdomain: lindermedia.de (ohne www) – passt zu Canonical und Sitemap.

# HTTP -> HTTPS (und ACME-Challenge fuer die Zertifikatserneuerung)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name lindermedia.de www.lindermedia.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://lindermedia.de$request_uri;
    }
}

# www -> Hauptdomain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lindermedia.de;

    ssl_certificate     /etc/letsencrypt/live/lindermedia.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lindermedia.de/privkey.pem;

    return 301 https://lindermedia.de$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lindermedia.de;

    ssl_certificate     /etc/letsencrypt/live/lindermedia.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lindermedia.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HSTS erst setzen, wenn HTTPS nachweislich stabil laeuft (6 Monate, ohne preload).
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Videos bis ein paar hundert MB; Kontaktformular ist klein.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
